<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Beyond Say No — an interactive visual-communication intervention for drug-risk recognition and help-seeking.">
  <title>Beyond Say No | Interactive Intervention</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="site-shell">
    <header class="topbar" id="topbar">
      <button id="brandButton" class="brand" type="button" data-action="home" aria-label="Return to Beyond Say No home">
        <span class="brand-mark">BSN</span>
        <span>BEYOND SAY NO</span>
      </button>

      <div class="topbar-actions">
        <div class="progress-track" id="progressContainer" hidden aria-label="Progress">
          <div class="progress-bar" id="progressBar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
        </div>
        <span class="progress-text" id="progressLabel" aria-live="polite"></span>
        <button class="icon-button" id="homeButton" type="button" aria-label="Return to home" hidden>⌂</button>
      </div>
    </header>

    <main id="app-container" tabindex="-1"></main>

    <footer class="footer">
      <span>Interactive research intervention • Beyond Say No</span>
      <span>Information is educational and does not replace professional care.</span>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
